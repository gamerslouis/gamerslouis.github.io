<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600"
     font-family="'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Helvetica Neue', Arial, sans-serif"
     font-size="13" fill="#333">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>

  <!-- connectors -->
  <g stroke="#999" stroke-width="1.5" fill="none">
    <line x1="480" y1="80" x2="480" y2="113" marker-end="url(#arrow)"/>
    <line x1="430" y1="215" x2="240" y2="265"/>
    <line x1="530" y1="215" x2="720" y2="265"/>
    <line x1="240" y1="365" x2="95" y2="420"/>
    <line x1="240" y1="365" x2="215" y2="420"/>
    <line x1="240" y1="365" x2="385" y2="420"/>
    <line x1="720" y1="365" x2="575" y2="420"/>
    <line x1="720" y1="365" x2="695" y2="420"/>
    <line x1="720" y1="365" x2="865" y2="420"/>
  </g>

  <!-- rcu_state -->
  <rect x="330" y="20" width="300" height="60" rx="6" fill="#fdf3e1" stroke="#e08e0b" stroke-width="1.5"/>
  <text x="480" y="45" text-anchor="middle" font-weight="bold">struct rcu_state（全域只有一個）</text>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#555">gp_seq、gp_flags、grace period kthread</text>

  <!-- root rcu_node -->
  <rect x="330" y="115" width="300" height="100" rx="6" fill="#eef2fb" stroke="#4d5fb8" stroke-width="1.5"/>
  <text x="480" y="139" text-anchor="middle" font-weight="bold">struct rcu_node（根節點）</text>
  <text x="480" y="159" text-anchor="middle" font-size="12" fill="#555">qsmask：每個 bit 對應一個子節點</text>
  <rect x="420" y="168" width="60" height="22" fill="#f5a623" fill-opacity="0.45" stroke="#999"/>
  <rect x="480" y="168" width="60" height="22" fill="#eeeeee" stroke="#999"/>
  <text x="450" y="184" text-anchor="middle" font-weight="bold" fill="#8a5300">1</text>
  <text x="510" y="184" text-anchor="middle" font-weight="bold" fill="#999">0</text>
  <text x="450" y="206" text-anchor="middle" font-size="10" fill="#777">CPU 0–15</text>
  <text x="510" y="206" text-anchor="middle" font-size="10" fill="#777">CPU 16–31</text>

  <text x="318" y="160" text-anchor="end" font-size="12" fill="#8a5300">左邊的葉節點還有 CPU 沒回報，</text>
  <text x="318" y="178" text-anchor="end" font-size="12" fill="#8a5300">對應的 bit 仍是 1</text>
  <text x="642" y="160" text-anchor="start" font-size="12" fill="#555">右邊的葉節點已經全部回報，</text>
  <text x="642" y="178" text-anchor="start" font-size="12" fill="#555">由最後回報的 CPU 清掉這個 bit</text>

  <!-- leaf rcu_node: CPU 0-15 -->
  <rect x="40" y="265" width="400" height="100" rx="6" fill="#eef2fb" stroke="#4d5fb8" stroke-width="1.5"/>
  <text x="240" y="289" text-anchor="middle" font-weight="bold">struct rcu_node（葉節點）：CPU 0–15</text>
  <text x="240" y="309" text-anchor="middle" font-size="12" fill="#555">qsmask：每個 bit 對應一顆 CPU</text>
  <g stroke="#999">
    <rect x="80"  y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="100" y="318" width="20" height="20" fill="#f5a623" fill-opacity="0.45"/>
    <rect x="120" y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="140" y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="160" y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="180" y="318" width="20" height="20" fill="#f5a623" fill-opacity="0.45"/>
    <rect x="200" y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="220" y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="240" y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="260" y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="280" y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="300" y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="320" y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="340" y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="360" y="318" width="20" height="20" fill="#eeeeee"/>
    <rect x="380" y="318" width="20" height="20" fill="#eeeeee"/>
  </g>
  <g font-size="10" fill="#777" text-anchor="middle">
    <text x="90" y="354">0</text>
    <text x="110" y="354">1</text>
    <text x="190" y="354">5</text>
    <text x="390" y="354">15</text>
  </g>

  <!-- leaf rcu_node: CPU 16-31 -->
  <rect x="520" y="265" width="400" height="100" rx="6" fill="#eef2fb" stroke="#4d5fb8" stroke-width="1.5"/>
  <text x="720" y="289" text-anchor="middle" font-weight="bold">struct rcu_node（葉節點）：CPU 16–31</text>
  <text x="720" y="309" text-anchor="middle" font-size="12" fill="#555">qsmask：每個 bit 對應一顆 CPU</text>
  <g stroke="#999" fill="#eeeeee">
    <rect x="560" y="318" width="20" height="20"/><rect x="580" y="318" width="20" height="20"/>
    <rect x="600" y="318" width="20" height="20"/><rect x="620" y="318" width="20" height="20"/>
    <rect x="640" y="318" width="20" height="20"/><rect x="660" y="318" width="20" height="20"/>
    <rect x="680" y="318" width="20" height="20"/><rect x="700" y="318" width="20" height="20"/>
    <rect x="720" y="318" width="20" height="20"/><rect x="740" y="318" width="20" height="20"/>
    <rect x="760" y="318" width="20" height="20"/><rect x="780" y="318" width="20" height="20"/>
    <rect x="800" y="318" width="20" height="20"/><rect x="820" y="318" width="20" height="20"/>
    <rect x="840" y="318" width="20" height="20"/><rect x="860" y="318" width="20" height="20"/>
  </g>
  <g font-size="10" fill="#777" text-anchor="middle">
    <text x="570" y="354">16</text>
    <text x="870" y="354">31</text>
  </g>

  <!-- rcu_data boxes -->
  <g>
    <rect x="40"  y="420" width="110" height="100" rx="6" fill="#ffffff" stroke="#3bb273" stroke-width="1.5"/>
    <rect x="160" y="420" width="110" height="100" rx="6" fill="#fff7ea" stroke="#e08e0b" stroke-width="1.5"/>
    <rect x="330" y="420" width="110" height="100" rx="6" fill="#ffffff" stroke="#3bb273" stroke-width="1.5"/>
    <rect x="520" y="420" width="110" height="100" rx="6" fill="#ffffff" stroke="#3bb273" stroke-width="1.5"/>
    <rect x="640" y="420" width="110" height="100" rx="6" fill="#ffffff" stroke="#3bb273" stroke-width="1.5"/>
    <rect x="810" y="420" width="110" height="100" rx="6" fill="#ffffff" stroke="#3bb273" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-weight="bold" font-size="12">
    <text x="95"  y="440">rcu_data：CPU 0</text>
    <text x="215" y="440">rcu_data：CPU 1</text>
    <text x="385" y="440">rcu_data：CPU 15</text>
    <text x="575" y="440">rcu_data：CPU 16</text>
    <text x="695" y="440">rcu_data：CPU 17</text>
    <text x="865" y="440">rcu_data：CPU 31</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#555">
    <text x="95"  y="460">gp_seq</text><text x="95"  y="476">cpu_no_qs</text><text x="95"  y="492">core_needs_qs</text><text x="95"  y="508">cblist</text>
    <text x="215" y="460">gp_seq</text><text x="215" y="476">cpu_no_qs</text><text x="215" y="492">core_needs_qs</text><text x="215" y="508">cblist</text>
    <text x="385" y="460">gp_seq</text><text x="385" y="476">cpu_no_qs</text><text x="385" y="492">core_needs_qs</text><text x="385" y="508">cblist</text>
    <text x="575" y="460">gp_seq</text><text x="575" y="476">cpu_no_qs</text><text x="575" y="492">core_needs_qs</text><text x="575" y="508">cblist</text>
    <text x="695" y="460">gp_seq</text><text x="695" y="476">cpu_no_qs</text><text x="695" y="492">core_needs_qs</text><text x="695" y="508">cblist</text>
    <text x="865" y="460">gp_seq</text><text x="865" y="476">cpu_no_qs</text><text x="865" y="492">core_needs_qs</text><text x="865" y="508">cblist</text>
  </g>
  <text x="300" y="474" text-anchor="middle" font-size="16" fill="#888">…</text>
  <text x="780" y="474" text-anchor="middle" font-size="16" fill="#888">…</text>

  <!-- legend -->
  <g font-size="12">
    <rect x="40" y="552" width="20" height="16" fill="#f5a623" fill-opacity="0.45" stroke="#999"/>
    <text x="68" y="565">bit = 1：還沒回報</text>
    <rect x="200" y="552" width="20" height="16" fill="#eeeeee" stroke="#999"/>
    <text x="228" y="565">bit = 0：已經回報</text>
    <rect x="360" y="552" width="20" height="16" rx="3" fill="#ffffff" stroke="#3bb273" stroke-width="1.5"/>
    <text x="388" y="565">per-CPU 的 rcu_data，只有自己這顆 CPU 會修改</text>
    <rect x="690" y="552" width="20" height="16" rx="3" fill="#fff7ea" stroke="#e08e0b" stroke-width="1.5"/>
    <text x="718" y="565">還沒回報的 CPU</text>
  </g>
</svg>
