<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 770" width="960" height="770"
     font-family="'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Helvetica Neue', Arial, sans-serif"
     font-size="12" fill="#333">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="770" fill="#ffffff"/>

  <!-- column headers -->
  <rect x="20"  y="16" width="230" height="46" rx="6" fill="#eaf2fb" stroke="#2c6fb7"/>
  <rect x="270" y="16" width="230" height="46" rx="6" fill="#eaf2fb" stroke="#2c6fb7"/>
  <rect x="525" y="16" width="190" height="46" rx="6" fill="#eef0fb" stroke="#4d5fb8"/>
  <rect x="745" y="16" width="190" height="46" rx="6" fill="#fdf3e1" stroke="#e08e0b"/>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="135" y="36">CPU 0（寫入者所在）</text>
    <text x="385" y="36">每顆 CPU（包含 CPU 0）</text>
    <text x="620" y="36">rcu_node 樹</text>
    <text x="840" y="36">grace period kthread</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#666">
    <text x="135" y="54">tick、softirq</text>
    <text x="385" y="54">tick、softirq、context switch</text>
    <text x="620" y="54">gp_seq、qsmask</text>
    <text x="840" y="54">rcu_sched</text>
  </g>

  <!-- lifelines -->
  <g stroke="#cccccc" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="135" y1="62" x2="135" y2="750"/>
    <line x1="385" y1="62" x2="385" y2="750"/>
    <line x1="620" y1="62" x2="620" y2="750"/>
    <line x1="840" y1="62" x2="840" y2="750"/>
  </g>

  <!-- step 1: CPU 0 registers a callback and requests a GP -->
  <rect x="20" y="88" width="230" height="64" rx="6" fill="#ffffff" stroke="#2c6fb7" stroke-width="1.5"/>
  <text x="135" y="106" text-anchor="middle" font-weight="bold" fill="#b86e00">call_rcu()</text>
  <text x="135" y="123" text-anchor="middle">callback 放進自己的 cblist</text>
  <text x="135" y="141" text-anchor="middle"><tspan fill="#6a5cb0" font-weight="bold">tick → softirq</tspan>：請求新的一輪</text>
  <line x1="250" y1="134" x2="836" y2="134" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="127" text-anchor="middle" fill="#555">喚醒 kthread</text>

  <!-- step 2: kthread starts the GP -->
  <rect x="745" y="166" width="190" height="64" rx="6" fill="#ffffff" stroke="#e08e0b" stroke-width="1.5"/>
  <text x="840" y="184" text-anchor="middle" font-weight="bold" fill="#b86e00">rcu_gp_init()</text>
  <text x="840" y="201" text-anchor="middle">gp_seq：8 → 9</text>
  <text x="840" y="219" text-anchor="middle">每個節點的 qsmask 設成 1</text>
  <rect x="525" y="174" width="190" height="48" rx="6" fill="#eef0fb" stroke="#4d5fb8" stroke-width="1.5"/>
  <text x="620" y="194" text-anchor="middle">gp_seq = 9</text>
  <text x="620" y="212" text-anchor="middle">qsmask 全部是 1</text>
  <line x1="745" y1="198" x2="719" y2="198" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- kthread waits and nudges between step 2 and step 6 -->
  <rect x="760" y="300" width="160" height="150" rx="6" fill="#fdf3e1" stroke="#e08e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="840" y="322" text-anchor="middle" font-weight="bold" fill="#b86e00">rcu_gp_fqs_loop()</text>
  <text x="840" y="344" text-anchor="middle">每隔幾個 jiffies 醒來，</text>
  <text x="840" y="362" text-anchor="middle">檢查根節點的 qsmask</text>
  <text x="840" y="388" text-anchor="middle">替 idle 的 CPU 回報、</text>
  <text x="840" y="406" text-anchor="middle">催促遲遲不回報的 CPU</text>
  <text x="840" y="432" text-anchor="middle" font-size="11" fill="#666">（等待與催促）</text>

  <!-- step 3: each CPU notices the new GP -->
  <rect x="270" y="256" width="230" height="64" rx="6" fill="#ffffff" stroke="#2c6fb7" stroke-width="1.5"/>
  <text x="385" y="274" text-anchor="middle" font-weight="bold" fill="#6a5cb0">tick → softirq</text>
  <text x="385" y="291" text-anchor="middle">發現葉節點的 gp_seq 變了</text>
  <text x="385" y="309" text-anchor="middle">標記：這一輪還沒經過 QS</text>
  <path d="M560,222 L500,262" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="560" y="250" fill="#555">讀取 gp_seq</text>

  <!-- step 4: quiescent state -->
  <rect x="270" y="342" width="230" height="64" rx="6" fill="#ffffff" stroke="#2c6fb7" stroke-width="1.5"/>
  <text x="385" y="360" text-anchor="middle" font-weight="bold" fill="#23834f">context switch / user mode / idle</text>
  <text x="385" y="377" text-anchor="middle">rcu_qs()</text>
  <text x="385" y="395" text-anchor="middle">記錄：已經經過 QS</text>

  <!-- step 5: report up the tree -->
  <rect x="270" y="428" width="230" height="64" rx="6" fill="#ffffff" stroke="#2c6fb7" stroke-width="1.5"/>
  <text x="385" y="446" text-anchor="middle" font-weight="bold" fill="#6a5cb0">tick → softirq</text>
  <text x="385" y="463" text-anchor="middle">rcu_report_qs_rdp()</text>
  <text x="385" y="481" text-anchor="middle">往上回報</text>
  <rect x="525" y="436" width="190" height="48" rx="6" fill="#eef0fb" stroke="#4d5fb8" stroke-width="1.5"/>
  <text x="620" y="456" text-anchor="middle">清掉這顆 CPU 的 bit</text>
  <text x="620" y="474" text-anchor="middle">節點清空就往上一層</text>
  <line x1="500" y1="460" x2="521" y2="460" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 6: last CPU wakes kthread, kthread ends the GP -->
  <rect x="525" y="514" width="190" height="48" rx="6" fill="#eef0fb" stroke="#4d5fb8" stroke-width="1.5"/>
  <text x="620" y="534" text-anchor="middle">最後一個 CPU</text>
  <text x="620" y="552" text-anchor="middle">清空了根節點的 qsmask</text>
  <line x1="715" y1="538" x2="741" y2="538" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="728" y="530" text-anchor="middle" fill="#555" font-size="11">喚醒</text>
  <rect x="745" y="506" width="190" height="64" rx="6" fill="#ffffff" stroke="#e08e0b" stroke-width="1.5"/>
  <text x="840" y="524" text-anchor="middle" font-weight="bold" fill="#b86e00">rcu_gp_cleanup()</text>
  <text x="840" y="541" text-anchor="middle">gp_seq：9 → 12</text>
  <text x="840" y="559" text-anchor="middle">宣告這一輪結束</text>
  <rect x="525" y="592" width="190" height="34" rx="6" fill="#eef0fb" stroke="#4d5fb8" stroke-width="1.5"/>
  <text x="620" y="614" text-anchor="middle">每個節點的 gp_seq = 12</text>
  <path d="M840,570 L840,609 L719,609" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 7: CPU 0 notices the end and invokes the callback -->
  <rect x="20" y="652" width="230" height="82" rx="6" fill="#ffffff" stroke="#2c6fb7" stroke-width="1.5"/>
  <text x="135" y="670" text-anchor="middle" font-weight="bold" fill="#6a5cb0">tick → softirq</text>
  <text x="135" y="687" text-anchor="middle">發現這一輪結束了</text>
  <text x="135" y="705" text-anchor="middle">callback 移到可以執行的段落</text>
  <text x="135" y="723" text-anchor="middle">執行 callback</text>
  <path d="M525,620 L254,668" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="420" y="674" text-anchor="middle" fill="#555">讀取 gp_seq</text>

  <!-- step badges -->
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="20"  cy="88"  r="11" fill="#333"/><text x="20"  y="92">1</text>
    <circle cx="745" cy="166" r="11" fill="#333"/><text x="745" y="170">2</text>
    <circle cx="270" cy="256" r="11" fill="#333"/><text x="270" y="260">3</text>
    <circle cx="270" cy="342" r="11" fill="#333"/><text x="270" y="346">4</text>
    <circle cx="270" cy="428" r="11" fill="#333"/><text x="270" y="432">5</text>
    <circle cx="525" cy="514" r="11" fill="#333"/><text x="525" y="518">6</text>
    <circle cx="20"  cy="652" r="11" fill="#333"/><text x="20"  y="656">7</text>
  </g>

  <!-- time hint -->
  <line x1="950" y1="90" x2="950" y2="740" stroke="#bbb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="944" y="760" text-anchor="end" font-size="11" fill="#888">時間</text>
</svg>
