<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500"
     font-family="'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Helvetica Neue', Arial, sans-serif"
     font-size="13" fill="#333">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- grace period bands -->
  <rect x="150" y="88" width="300" height="212" fill="#f5a623" fill-opacity="0.13"/>
  <rect x="470" y="88" width="330" height="212" fill="#6c7fd8" fill-opacity="0.12"/>
  <g stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="150" y1="88" x2="150" y2="300" stroke="#e08e0b"/>
    <line x1="450" y1="88" x2="450" y2="300" stroke="#e08e0b"/>
    <line x1="470" y1="88" x2="470" y2="300" stroke="#4d5fb8"/>
    <line x1="800" y1="88" x2="800" y2="300" stroke="#4d5fb8"/>
  </g>
  <text x="300" y="108" text-anchor="middle" font-weight="bold" fill="#b86e00">GP 1</text>
  <text x="635" y="108" text-anchor="middle" font-weight="bold" fill="#4d5fb8">GP 2</text>

  <!-- callback registrations -->
  <g fill="#f5a623" stroke="#b86e00">
    <path d="M120,58 L129,67 L120,76 L111,67 z"/>
    <path d="M260,58 L269,67 L260,76 L251,67 z"/>
    <path d="M370,58 L379,67 L370,76 L361,67 z"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#b86e00">
    <text x="120" y="32">A：call_rcu()</text>
    <text x="120" y="48" font-size="11" fill="#666">沒有進行中的 GP</text>
    <text x="260" y="32">B：call_rcu()</text>
    <text x="260" y="48" font-size="11" fill="#666">GP 1 進行中</text>
    <text x="370" y="32">C：call_rcu()</text>
    <text x="370" y="48" font-size="11" fill="#666">GP 1 進行中</text>
  </g>

  <!-- lanes -->
  <g font-weight="bold" fill="#444">
    <text x="30" y="155">CPU 0</text>
    <text x="30" y="215">CPU 1</text>
    <text x="30" y="275">CPU 2</text>
  </g>
  <g stroke="#cccccc" stroke-width="1.5">
    <line x1="100" y1="150" x2="900" y2="150"/>
    <line x1="100" y1="210" x2="900" y2="210"/>
    <line x1="100" y1="270" x2="900" y2="270"/>
  </g>

  <!-- CPU 1 reports QS for GP 1 before B updates its pointer, then grabs B's old pointer -->
  <rect x="215" y="199" width="305" height="22" rx="4" fill="#4a90d9" stroke="#2c6fb7"/>
  <text x="367" y="215" text-anchor="middle" fill="#ffffff">critical section：拿到 B 的 old</text>
  <text x="186" y="239" text-anchor="start" font-size="12" fill="#23834f">B 更新指標前就回報了</text>
  <text x="522" y="239" text-anchor="end" font-size="12" fill="#2c6fb7">GP 1 已結束，B 的 old 還在使用</text>

  <!-- QS dots -->
  <g fill="#3bb273" stroke="#23834f">
    <!-- GP 1 -->
    <circle cx="310" cy="150" r="7"/>
    <circle cx="200" cy="210" r="7"/>
    <circle cx="450" cy="270" r="7"/>
    <!-- GP 2 -->
    <circle cx="800" cy="150" r="7"/>
    <circle cx="545" cy="210" r="7"/>
    <circle cx="610" cy="270" r="7"/>
  </g>

  <!-- callback waiting bars -->
  <g font-weight="bold" fill="#444" font-size="12">
    <text x="30" y="337">callback A</text>
    <text x="30" y="371">callback B</text>
    <text x="30" y="405">callback C</text>
  </g>
  <g>
    <rect x="120" y="326" width="330" height="16" rx="3" fill="#f5a623" fill-opacity="0.35" stroke="#e08e0b"/>
    <text x="285" y="338" text-anchor="middle" font-size="12" fill="#8a5300">等完 GP 1</text>
    <text x="462" y="338" font-size="12">GP 1 結束後執行</text>

    <rect x="260" y="360" width="540" height="16" rx="3" fill="#6c7fd8" fill-opacity="0.3" stroke="#4d5fb8"/>
    <text x="530" y="372" text-anchor="middle" font-size="12" fill="#2f3f8f">GP 1 開始時還沒註冊，不算數，要等完整的 GP 2</text>
    <text x="812" y="372" font-size="12">GP 2 結束後執行</text>

    <rect x="370" y="394" width="430" height="16" rx="3" fill="#6c7fd8" fill-opacity="0.3" stroke="#4d5fb8"/>
    <text x="585" y="406" text-anchor="middle" font-size="12" fill="#2f3f8f">跟 B 一起等 GP 2</text>
    <text x="812" y="406" font-size="12">跟 B 一起執行</text>
  </g>
  <g fill="#3bb273" stroke="#23834f">
    <circle cx="450" cy="334" r="5"/>
    <circle cx="800" cy="368" r="5"/>
    <circle cx="800" cy="402" r="5"/>
  </g>

  <!-- time axis -->
  <line x1="100" y1="434" x2="900" y2="434" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="910" y="439" font-size="12" fill="#666">時間</text>

  <!-- legend -->
  <g font-size="12">
    <path d="M54,463 L63,472 L54,481 L45,472 z" fill="#f5a623" stroke="#b86e00"/>
    <text x="72" y="477">寫入者更新指標並註冊 callback</text>
    <circle cx="305" cy="472" r="7" fill="#3bb273" stroke="#23834f"/>
    <text x="319" y="477">quiescent state</text>
    <rect x="450" y="465" width="28" height="14" rx="3" fill="#4a90d9" stroke="#2c6fb7"/>
    <text x="486" y="477">read-side critical section</text>
    <rect x="690" y="465" width="28" height="14" fill="#f5a623" fill-opacity="0.25" stroke="#e08e0b" stroke-dasharray="4 3"/>
    <text x="726" y="477">grace period</text>
  </g>
</svg>
