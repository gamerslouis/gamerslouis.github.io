<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520"
     font-family="'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Helvetica Neue', Arial, sans-serif"
     font-size="12" fill="#333">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrow-step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- column headers (same for all panels) -->
  <g text-anchor="middle" font-weight="bold">
    <text x="300" y="24" fill="#23834f">DONE</text>
    <text x="490" y="24" fill="#b86e00">WAIT</text>
    <text x="680" y="24" fill="#4d5fb8">NEXT_READY</text>
    <text x="860" y="24" fill="#666">NEXT</text>
  </g>

  <!-- ================= panel (a) ================= -->
  <text x="20" y="62" font-weight="bold">(a) gp_seq = 9</text>
  <text x="20" y="80" font-size="11" fill="#666">call_rcu() 加入 cb8</text>
  <rect x="215" y="44" width="170" height="60" rx="6" fill="#3bb273" fill-opacity="0.12" stroke="#3bb273"/>
  <rect x="405" y="44" width="170" height="60" rx="6" fill="#f5a623" fill-opacity="0.12" stroke="#e08e0b"/>
  <rect x="595" y="44" width="170" height="60" rx="6" fill="#6c7fd8" fill-opacity="0.12" stroke="#4d5fb8"/>
  <rect x="785" y="44" width="150" height="60" rx="6" fill="#bbbbbb" fill-opacity="0.18" stroke="#999"/>
  <text x="300" y="80" text-anchor="middle" fill="#999">（空）</text>
  <g fill="#ffffff" stroke="#666">
    <rect x="420" y="58" width="60" height="30" rx="4"/><rect x="500" y="58" width="60" height="30" rx="4"/>
    <rect x="650" y="58" width="60" height="30" rx="4"/>
    <rect x="830" y="58" width="60" height="30" rx="4" stroke="#e08e0b" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="450" y="78">cb3</text><text x="530" y="78">cb4</text>
    <text x="680" y="78">cb5</text>
    <text x="860" y="78" font-weight="bold" fill="#b86e00">cb8</text>
  </g>
  <g text-anchor="middle" font-size="11">
    <text x="490" y="120" fill="#b86e00">等 12</text>
    <text x="680" y="120" fill="#4d5fb8">等 16</text>
    <text x="860" y="120" fill="#666">還沒分配</text>
  </g>

  <line x1="480" y1="132" x2="480" y2="166" stroke="#e08e0b" stroke-width="2" marker-end="url(#arrow-step)"/>
  <text x="492" y="146" font-size="12" fill="#b86e00">rcu_accelerate_cbs()：rcu_seq_snap(9) = 16</text>
  <text x="492" y="162" font-size="12" fill="#b86e00">cb8 要等的跟 cb5 一樣，併進同一段</text>

  <!-- ================= panel (b) ================= -->
  <text x="20" y="208" font-weight="bold">(b) gp_seq = 9</text>
  <text x="20" y="226" font-size="11" fill="#666">分配序號之後</text>
  <rect x="215" y="190" width="170" height="60" rx="6" fill="#3bb273" fill-opacity="0.12" stroke="#3bb273"/>
  <rect x="405" y="190" width="170" height="60" rx="6" fill="#f5a623" fill-opacity="0.12" stroke="#e08e0b"/>
  <rect x="595" y="190" width="170" height="60" rx="6" fill="#6c7fd8" fill-opacity="0.12" stroke="#4d5fb8"/>
  <rect x="785" y="190" width="150" height="60" rx="6" fill="#bbbbbb" fill-opacity="0.18" stroke="#999"/>
  <text x="300" y="226" text-anchor="middle" fill="#999">（空）</text>
  <text x="860" y="226" text-anchor="middle" fill="#999">（空）</text>
  <g fill="#ffffff" stroke="#666">
    <rect x="420" y="204" width="60" height="30" rx="4"/><rect x="500" y="204" width="60" height="30" rx="4"/>
    <rect x="610" y="204" width="60" height="30" rx="4"/>
    <rect x="690" y="204" width="60" height="30" rx="4" stroke="#e08e0b" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="450" y="224">cb3</text><text x="530" y="224">cb4</text>
    <text x="640" y="224">cb5</text>
    <text x="720" y="224" font-weight="bold" fill="#b86e00">cb8</text>
  </g>
  <g text-anchor="middle" font-size="11">
    <text x="490" y="266" fill="#b86e00">等 12</text>
    <text x="680" y="266" fill="#4d5fb8">等 16</text>
  </g>

  <line x1="480" y1="278" x2="480" y2="312" stroke="#e08e0b" stroke-width="2" marker-end="url(#arrow-step)"/>
  <text x="492" y="292" font-size="12" fill="#b86e00">第三輪結束，gp_seq 變成 12：rcu_advance_cbs()</text>
  <text x="492" y="308" font-size="12" fill="#b86e00">把等 12 的段落併入 DONE，等 16 的往前遞補</text>

  <!-- ================= panel (c) ================= -->
  <text x="20" y="354" font-weight="bold">(c) gp_seq = 12</text>
  <text x="20" y="372" font-size="11" fill="#666">推進之後</text>
  <rect x="215" y="336" width="170" height="60" rx="6" fill="#3bb273" fill-opacity="0.12" stroke="#3bb273"/>
  <rect x="405" y="336" width="170" height="60" rx="6" fill="#f5a623" fill-opacity="0.12" stroke="#e08e0b"/>
  <rect x="595" y="336" width="170" height="60" rx="6" fill="#6c7fd8" fill-opacity="0.12" stroke="#4d5fb8"/>
  <rect x="785" y="336" width="150" height="60" rx="6" fill="#bbbbbb" fill-opacity="0.18" stroke="#999"/>
  <text x="680" y="372" text-anchor="middle" fill="#999">（空）</text>
  <text x="860" y="372" text-anchor="middle" fill="#999">（空）</text>
  <g fill="#ffffff" stroke="#666">
    <rect x="230" y="350" width="60" height="30" rx="4"/><rect x="310" y="350" width="60" height="30" rx="4"/>
    <rect x="420" y="350" width="60" height="30" rx="4"/>
    <rect x="500" y="350" width="60" height="30" rx="4" stroke="#e08e0b" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="260" y="370">cb3</text><text x="340" y="370">cb4</text>
    <text x="450" y="370">cb5</text>
    <text x="530" y="370" font-weight="bold" fill="#b86e00">cb8</text>
  </g>
  <g text-anchor="middle" font-size="11">
    <text x="300" y="412" fill="#23834f">可以執行</text>
    <text x="490" y="412" fill="#b86e00">等 16（下一輪開始後就是目前這一輪）</text>
  </g>

  <!-- notes -->
  <g font-size="12" fill="#555">
    <text x="20" y="458">每一段旁邊的「等 N」就是 rcu_segcblist 的 gp_seq[i]。段落的名稱代表相對位置（目前這一輪、下一輪），</text>
    <text x="20" y="478">所以同一批 callback 會隨著 grace period 推進，從 NEXT_READY 變成 WAIT，最後進入 DONE。</text>
    <text x="20" y="498">實際上四段仍然是同一條 linked list，移動 callback 只需要調整 tails[] 指標。</text>
  </g>
</svg>
