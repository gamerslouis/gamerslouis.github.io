<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330"
     font-family="'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Helvetica Neue', Arial, sans-serif"
     font-size="13" fill="#333">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrow-tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d5fb8"/>
    </marker>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="330" fill="#ffffff"/>

  <!-- segment backgrounds -->
  <rect x="105" y="100" width="184" height="70" rx="6" fill="#3bb273" fill-opacity="0.15" stroke="#3bb273"/>
  <rect x="305" y="100" width="184" height="70" rx="6" fill="#f5a623" fill-opacity="0.15" stroke="#e08e0b"/>
  <rect x="505" y="100" width="94"  height="70" rx="6" fill="#6c7fd8" fill-opacity="0.15" stroke="#4d5fb8"/>
  <rect x="615" y="100" width="184" height="70" rx="6" fill="#bbbbbb" fill-opacity="0.2" stroke="#999"/>

  <!-- segment labels -->
  <g text-anchor="middle">
    <text x="197" y="70" font-weight="bold" fill="#23834f">DONE</text>
    <text x="197" y="88" font-size="12" fill="#23834f">grace period 已結束，可以執行</text>
    <text x="397" y="70" font-weight="bold" fill="#b86e00">WAIT</text>
    <text x="397" y="88" font-size="12" fill="#b86e00">等目前這一輪：gp_seq = 12</text>
    <text x="552" y="70" font-weight="bold" fill="#4d5fb8">NEXT_READY</text>
    <text x="552" y="88" font-size="12" fill="#4d5fb8">等下一輪：16</text>
    <text x="707" y="70" font-weight="bold" fill="#666">NEXT</text>
    <text x="707" y="88" font-size="12" fill="#666">剛加入，還沒分配</text>
  </g>

  <!-- head -->
  <rect x="24" y="118" width="56" height="34" rx="4" fill="#ffffff" stroke="#666"/>
  <text x="52" y="140" text-anchor="middle" font-weight="bold">head</text>

  <!-- callback nodes -->
  <g fill="#ffffff" stroke="#666">
    <rect x="120" y="118" width="64" height="34" rx="4"/>
    <rect x="210" y="118" width="64" height="34" rx="4"/>
    <rect x="320" y="118" width="64" height="34" rx="4"/>
    <rect x="410" y="118" width="64" height="34" rx="4"/>
    <rect x="520" y="118" width="64" height="34" rx="4"/>
    <rect x="630" y="118" width="64" height="34" rx="4"/>
    <rect x="720" y="118" width="64" height="34" rx="4"/>
  </g>
  <g text-anchor="middle">
    <text x="152" y="140">cb1</text>
    <text x="242" y="140">cb2</text>
    <text x="352" y="140">cb3</text>
    <text x="442" y="140">cb4</text>
    <text x="552" y="140">cb5</text>
    <text x="662" y="140">cb6</text>
    <text x="752" y="140">cb7</text>
  </g>
  <text x="852" y="140" text-anchor="middle" font-weight="bold" fill="#888">NULL</text>

  <!-- next pointers -->
  <g stroke="#666" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="80"  y1="135" x2="118" y2="135"/>
    <line x1="184" y1="135" x2="208" y2="135"/>
    <line x1="274" y1="135" x2="318" y2="135"/>
    <line x1="384" y1="135" x2="408" y2="135"/>
    <line x1="474" y1="135" x2="518" y2="135"/>
    <line x1="584" y1="135" x2="628" y2="135"/>
    <line x1="694" y1="135" x2="718" y2="135"/>
    <line x1="784" y1="135" x2="828" y2="135"/>
  </g>
  <text x="808" y="112" text-anchor="start" font-size="12" fill="#666">call_rcu() 加在這裡</text>

  <!-- tails[] -->
  <g stroke="#4d5fb8" stroke-width="1.5" marker-end="url(#arrow-tail)">
    <line x1="262" y1="218" x2="262" y2="156"/>
    <line x1="462" y1="218" x2="462" y2="156"/>
    <line x1="572" y1="218" x2="572" y2="156"/>
    <line x1="772" y1="218" x2="772" y2="156"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#4d5fb8">
    <text x="262" y="234">tails[0]</text>
    <text x="462" y="234">tails[1]</text>
    <text x="572" y="234">tails[2]</text>
    <text x="772" y="234">tails[3]</text>
  </g>
  <text x="52" y="234" font-size="12" fill="#4d5fb8" text-anchor="middle">tails[i]：</text>
  <text x="52" y="250" font-size="11" fill="#4d5fb8" text-anchor="middle">第 i 段的結尾</text>

  <!-- flow direction -->
  <line x1="790" y1="290" x2="125" y2="290" stroke="#e08e0b" stroke-width="2" marker-end="url(#arrow-flow)"/>
  <text x="457" y="280" text-anchor="middle" font-size="12" fill="#b86e00">每當一輪 grace period 結束，已經等到的段落就往左併入 DONE（只需要移動 tails 指標）</text>
</svg>
